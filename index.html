<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#67A7CC"><title>高知・四国旅行｜候補地検討</title>
<style>
:root{
  --ink:#24333e;
  --muted:#73818a;
  --paper:#f2f7fa;
  --card:#ffffff;
  --line:#dce8ef;
  --green:#67A7CC;
  --mint:#e7f2f8;
  --shadow:0 12px 32px #20302812}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.65}a{color:var(--green);text-underline-offset:3px}
.hero{
  background:linear-gradient(125deg,#376d8c,#67A7CC 58%,#a4cce1);
  color:white;
  padding:34px 20px 30px;
  position:relative;overflow:hidden}.wrap{max-width:1080px;margin:auto}.kicker{font-size:11px;
  letter-spacing:.2em;
  color:#d4e1d7
}
h1{font:500 clamp(30px,7vw,48px)/1.15 Georgia,"Yu Mincho",serif;margin:12px 0}.hero p{margin:0;color:#e4ece5;font-size:13px}.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.pill{border:1px solid #ffffff55;border-radius:99px;padding:5px 10px;font-size:11px}
main{max-width:1080px;margin:auto;padding:22px 16px 54px}.notice{background:#fff9ed;border:1px solid #eadcc2;border-radius:13px;padding:13px 15px;font-size:12px;color:#6d5a3f;margin-bottom:20px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}.summary article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.summary small{display:block;color:var(--muted);font-size:11px}.summary b{font:500 25px Georgia,serif}
.section-head{margin:28px 0 13px}.section-head h2{font:500 23px Georgia,"Yu Mincho",serif;margin:0}.section-head p{margin:3px 0 0;color:var(--muted);font-size:11px}
.people-legend{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 16px}.person-chip{border:1px solid var(--line);background:#fffefa;border-radius:99px;padding:5px 10px;font-size:11px;color:var(--muted)}.owner-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}select,.search{border:1px solid var(--line);background:#fffefa;border-radius:9px;padding:10px 12px;color:var(--ink);font:inherit;font-size:12px;min-height:40px}.search{flex:1;min-width:170px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}.card-top{padding:15px 16px 10px;display:flex;justify-content:space-between;gap:8px}.category{font-size:10px;letter-spacing:.08em;color:var(--muted)}.status{font-size:10px;border-radius:99px;padding:4px 9px;background:#edf0e9;color:#53675a;white-space:nowrap}.status.closed{background:#f7e9e4;color:#9a4f36}
.visual{height:112px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#dfe9df,#b8cbbd);position:relative;overflow:hidden}.visual:before,.visual:after{content:"";position:absolute;border-radius:50%;background:#ffffff35}.visual:before{width:190px;height:190px;right:-28px;top:-104px}.visual:after{width:125px;height:125px;left:-35px;bottom:-82px}.visual span{font-size:42px;z-index:1;filter:drop-shadow(0 5px 5px #0002)}
.visual img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.card-body{padding:13px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}.card h3{font-size:18px;line-height:1.35;margin:0}.owner{font-size:10px;color:var(--green);background:var(--mint);border-radius:5px;padding:3px 7px;display:inline-block}.owner.pending{background:#f3eee5;color:#876c4b}.desc{font-size:12px;color:#5e6962;margin:0}.label{font-size:10px;color:var(--muted);letter-spacing:.06em;font-weight:700;margin-bottom:3px}ul.activities{margin:0;padding-left:17px;font-size:12px;color:#45534b}ul.activities li{margin:2px 0}.info{border-top:1px solid var(--line);padding-top:9px;display:grid;gap:6px}.info-row{display:grid;grid-template-columns:48px 1fr;gap:7px;font-size:11px}.info-row b{color:var(--muted);font-weight:500}.rating{display:flex;align-items:center;gap:7px;font-size:11px}.stars{letter-spacing:2px;color:#b58a42;font-size:15px}.links{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;margin-top:auto;padding-top:3px}.links a{font-weight:600}.memo{font-size:11px;color:#8a6b4d;background:#f7f1e8;padding:8px 10px;border-radius:8px}.footer-note{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:11px}.empty{display:none;padding:30px;text-align:center;color:var(--muted);background:#fff;border-radius:12px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.summary{gap:7px}.summary article{padding:11px}.summary b{font-size:22px}.hero{padding:28px 18px 26px}}
</style></head>
<body>
<header class="hero"><div class="wrap"><div class="kicker">TRIP PLANNING / CANDIDATE LIST</div><h1>高知・四国旅行<br>候補地検討資料</h1><p>みんなの「行きたい」を集めて、実際に訪れる場所を決めるための資料。</p><div class="hero-meta"><span class="pill">第1版・デモ</span><span class="pill">行き先未決定</span><span class="pill">候補地を比較・検討中</span></div></div></header>
<main>
<div class="notice"><b>この資料について：</b>掲載している場所は現時点で出ている希望候補です。訪問先・順番・日程は未決定。おすすめ度も初期状態では未評価です。</div>
<div class="section-head"><h2>候補地一覧</h2><p>気になる場所の内容・アクセス・参考リンクを確認。</p></div>
<div class="people-legend" id="peopleLegend"></div>
<section id="cards" class="grid" aria-live="polite"></section><div id="empty" class="empty">該当する候補地がありません。</div>
</main>
<script>
/* 編集する場所：この places 配列。新しい候補地は既存の { ... } をコピーして追加。
   recommendation: 0〜5（0は未評価） / owners: ["me","personA"] のように希望者IDを配列で指定
   status: "未決定" / "保留" / "採用" / "見送り" / "営業終了" */
const places = [
{id:"shikoku-karst",name:"四国カルスト",category:"自然・絶景",owners:["me","personC"],image:"images/shikoku-karst.jpg",status:"未決定",description:"愛媛県と高知県の県境に広がる高原地帯。草原に白い石灰岩が点在し、放牧風景や雄大な眺望を楽しめる。",activities:["高原ドライブ・景色を楽しむ","ハイキング・散策","牛を見ることができる"],address:"高知県津野町・梼原町、愛媛県久万高原町にまたがるエリア",recommendation:0,memo:"県道383号は冬期閉鎖あり。訪問時期と道路状況の確認が必要。",official:"https://kochi-tabi.jp/search_spot_infocenter.html?id=1809",map:"四国カルスト"},
{id:"shimanto",name:"四万十川",category:"川・水辺",owners:["me"],image:"images/shimanto.jpg",status:"未決定",description:"高知県西部を流れる清流。川そのものが広いエリアなので、沈下橋など具体的な訪問地点を選んで検討したい。",activities:["沈下橋の景色・写真撮影","田舎の原風景が見れる","川沿いを散策"],address:"高知県西部（訪問地点は要選定）",recommendation:0,memo:"候補地点の例：佐田沈下橋（四万十市）。",official:"https://www.city.shimanto.lg.jp/soshiki/13/1454.html",map:"佐田沈下橋 高知県四万十市"},
{id:"nakatsu",name:"中津渓谷",category:"自然・絶景",owners:["me"],image:"images/nakatsu.jpg",status:"未決定",description:"仁淀川町にある渓谷。仁淀ブルーの水辺や奇岩、滝を見ながら遊歩道を歩ける。",activities:["遊歩道を散策","雨竜の滝・紅葉滝・竜宮渕などを見る","渓谷入口の温泉や食事を楽しむ"],address:"高知県吾川郡仁淀川町名野川",recommendation:0,memo:"雨竜の滝までは往復約1.3kmの遊歩道。歩きやすい靴がおすすめ。",official:"https://niyodoblue.jp/spot/detail.php?id=151",map:"中津渓谷 高知県仁淀川町"},
{id:"niyodo",name:"仁淀川",category:"川・水辺",owners:["me"],image:"images/niyodo.jpg",status:"未決定",description:"透明度の高い水と青い景観で知られる川。川全体の範囲が広いため、どの場所で何をするかを決めたい。",activities:["川沿いの景色・仁淀ブルーを楽しむ","水辺の散策・写真撮影","周辺の景勝地を組み合わせる"],address:"高知県中部（流域広域・訪問地点は要選定）",recommendation:0,memo:"中津渓谷とは別枠で登録。具体的なスポットを決める段階で重複を整理。",official:"https://niyodoblue.jp/agent/spot/",map:"仁淀川 高知県"},
{id:"keiba",name:"高知競馬場",category:"競馬",owners:["personA"],image:"images/keiba.jpg",status:"未決定",description:"高知市にある地方競馬場。",activities:["競馬レースを現地観戦","スタンドからレースの迫力を楽しむ","場内グルメなどを楽しむ"],address:"〒781-0271 高知県高知市長浜宮田2000番地",recommendation:0,tripMemo:"",memo:"11/22 はナイター開催予定、遅くなるので提案者が晩飯等を積極的に提案すること。また競馬を高知に行って見る意味は不明",official:"https://www.keiba.or.jp/",map:"高知競馬場 高知市"},
{id:"hirome",name:"ひろめ市場",category:"グルメ",owners:["me","personB"],image:"images/hirome.jpg",status:"未決定",description:"飲食店や鮮魚店、精肉店、お土産店などが集まる市場。好きな店で買った料理を共有スペースで楽しめる。",activities:["カツオのたたきなど高知グルメを食べる","複数の店を見て回る","お土産・特産品を探す"],address:"〒780-0841 高知県高知市帯屋町2丁目3-1",recommendation:0,memo:"店舗ごとに営業時間・定休日が異なる。市場全体の休館日も要確認。",official:"https://hirome.co.jp/",map:"ひろめ市場 高知市"},
{id:"ryugado",name:"龍河洞",category:"観光・体験",owners:["personD"],image:"images/ryugado.jpg",status:"未決定",description:"香美市にある鍾乳洞。長い年月をかけて形成された鍾乳石や洞内の見どころを観察できる。(どっかの洞窟で鬼ご)",activities:["観光コースで洞内を見学（約30〜40分）","鍾乳石や弥生時代の遺物を見る","予約制の冒険コースを体験（希望・条件に応じて）"],address:"〒782-0005 高知県香美市土佐山田町逆川1424",recommendation:0,memo:"観光コース大人1,500円の案内あり。料金・営業時間は訪問前に公式情報を再確認。",official:"https://ryugadou.or.jp/",map:"龍河洞 高知県香美市"},
{id:"zoo",name:"高知県立のいち動物公園",category:"動物",owners:["personD"],image:"images/zoo.jpg",status:"未決定",description:"緑豊かな園内で動物観察や自然散策を楽しめる。",activities:["園内で動物を観察","自然散策・ピクニック","開催日に園内イベントやガイドを楽しむ"],address:"高知県香南市野市町大谷738",recommendation:0,memo:"スコールタイムやジャングルタイムなどが設定されている",official:"https://noichizoo.or.jp/",map:"高知県立のいち動物公園"}
];
// 5人の名前はここで変更。希望者が分かったら、各候補地の owners にIDを追加する。
// 例：owners:["me","personA"] → 自分とメンバーAの希望
const members = [
  {id:"me", name:"伊川"},
  {id:"personA", name:"井本"},
  {id:"personB", name:"奥村"},
  {id:"personC", name:"小野田"},
  {id:"personD", name:"加賀野"}
];
const cards=document.getElementById("cards");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.getElementById("peopleLegend").innerHTML = members.map(m=>`<span class="person-chip">${esc(m.name)}</span>`).join("");
function render(){
 cards.innerHTML=places.map(p=>{
  const score=Math.max(0,Math.min(5,Number(p.recommendation)||0)),stars="★".repeat(score)+"☆".repeat(5-score),closed=p.status==="営業終了";
  const list=(p.activities||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  const map="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.map||p.address||p.name);
  const owners=(p.owners||[]).map(id=>members.find(m=>m.id===id)?.name).filter(Boolean);
  const ownerMarkup=owners.length?owners.map(n=>`<span class="owner">${esc(n)}の希望</span>`).join(" "):`<span class="owner pending">希望者確認中</span>`;
  return `<article class="card"><div class="card-top"><span class="category">${esc(p.category)}</span><span class="status ${closed?"closed":""}">${esc(p.status||"未決定")}</span></div>
  <div class="visual">  ${p.image
    ? `<img src="${esc(p.image)}" alt="${esc(p.name)}">`
    : `<span>${esc(p.icon||"📍")}</span>`
  }</div>
  <div class="card-body"><div><h3>${esc(p.name)}</h3><div class="owner-list">${ownerMarkup}</div></div><p class="desc">${esc(p.description)}</p><div><div class="label">できること・見どころ</div><ul class="activities">${list}</ul></div><div class="info"><div class="info-row"><b>住所</b><span>${esc(p.address||"要確認")}</span></div><div class="rating"><span class="label" style="margin:0">おすすめ度</span><span class="stars">${stars}</span><span>${score===0?"未評価":score+"/5"}</span></div></div>${p.memo?`<div class="memo">${esc(p.memo)}</div>`:""}<div class="links">${p.official?`<a href="${esc(p.official)}" target="_blank" rel="noopener">公式・参考情報 ↗</a>`:""}<a href="${map}" target="_blank" rel="noopener">地図を見る ↗</a></div></div></article>`;
 }).join("");
 document.getElementById("empty").style.display="none";
}
render();
</script></body></html>
